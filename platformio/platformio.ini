; TH.py (MicroPython) 的 PlatformIO / Arduino-ESP32 移植工程
; 目标芯片: ESP32-C3, DIO flash, 40MHz, 带 USB CDC 虚拟串口
;
; 常用命令:
;   pio run                     # 编译
;   pio run -t upload           # 烧录 (原生 USB 口为 /dev/ttyACM0)
;   pio device monitor          # 看日志

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; ---- Flash 配置: DIO + 40MHz ----
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 160000000L
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv

; ---- USB CDC: 上电即启用原生 USB 虚拟串口 (Serial == USB) ----
build_flags =
    -DARDUINO_USB_MODE=1    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall

upload_speed = 460800
monitor_speed = 115200
monitor_filters = colorize, esp32_exception_decoder

lib_deps =
    knolleary/PubSubClient@^2.8.0
    adafruit/Adafruit BMP280 Library@^3.0.0
    dvarrel/AHT20@^1.0.2
    bblanchon/ArduinoJson@^7.4.3
